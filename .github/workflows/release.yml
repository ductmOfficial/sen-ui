name: Release

# On every push to main, changesets/action does one of two things:
# - pending changesets exist: open or update the "chore: version packages" pull request;
# - that pull request was just merged (versions bumped, no changesets left): publish to npm.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the version branch, tags and GitHub releases
      pull-requests: write # open and update the version pull request
      id-token: write # npm trusted publishing (OIDC) and provenance, no stored npm token

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No `registry-url`: it writes an .npmrc that expects a NODE_AUTH_TOKEN, and trusted publishing needs none.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # When main holds a version that is not on npm yet, this run will publish. Check first that npm
      # accepts this workflow as a trusted publisher, and print why not: a failed OIDC exchange
      # otherwise surfaces only as "404 Not Found" from the publish request.
      - name: Check npm trusted publishing
        run: |
          name=$(jq -r .name packages/sen-ui/package.json)
          version=$(jq -r .version packages/sen-ui/package.json)
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No GitHub OIDC token. The job needs 'id-token: write'."
            exit 1
          fi
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "OIDC claims (not secret):"
          payload=$(cut -d. -f2 <<<"$id_token" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+="="; done
          base64 -d <<<"$payload" \
            | jq '{repository, repository_id, repository_owner, repository_owner_id, workflow_ref, job_workflow_ref, environment, ref, event_name}' || true
          encoded=$(jq -rn --arg n "$name" '$n | @uri')
          status=$(curl -sS -o exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$encoded")
          echo "npm OIDC token exchange: HTTP $status"
          jq 'del(.token)' exchange.json 2>/dev/null || true
          rm -f exchange.json
          # The exchange answers 201 Created on success.
          case "$status" in
            2??) ;;
            *)
              echo "::error::npm did not accept this workflow as a trusted publisher of $name (HTTP $status)."
              exit 1
              ;;
          esac

      - name: Create version pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          # Must pass commitlint, which CI runs on every pull request.
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
