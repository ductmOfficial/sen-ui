name: Release

# On every push to main, changesets/action does one of two things:
# - pending changesets exist: open or update the "chore: version packages" pull request;
# - that pull request was just merged (versions bumped, no changesets left): publish to npm.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the version branch, tags and GitHub releases
      pull-requests: write # open and update the version pull request
      id-token: write # npm trusted publishing (OIDC) and provenance, no stored npm token

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No `registry-url`: it writes an .npmrc that expects a NODE_AUTH_TOKEN, and trusted publishing needs none.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create version pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          # Must pass commitlint, which CI runs on every pull request.
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
